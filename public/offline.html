<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Finances</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
      button {
        height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 16px;
        background: #059669;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="t">No tens connexió</h1>
      <p id="d">Finances necessita connexió per mostrar les dades actualitzades. Es tornarà a carregar quan tornis a estar en línia.</p>
      <button id="b" type="button" onclick="location.reload()">Torna-ho a provar</button>
    </main>
    <script>
      (function () {
        var texts = {
          ca: ['No tens connexió', 'Finances necessita connexió per mostrar les dades actualitzades. Es tornarà a carregar quan tornis a estar en línia.', 'Torna-ho a provar'],
          es: ['Sin conexión', 'Finances necesita conexión para mostrar tus datos actualizados. Se recargará cuando vuelvas a estar en línea.', 'Reintentar'],
          en: ['You are offline', 'Finances needs a connection to show your up-to-date data. It will reload when you are back online.', 'Try again'],
        };
        var m = document.cookie.match(/(?:^|; )fin_locale=(ca|es|en)/);
        var l = m ? m[1] : 'ca';
        var t = texts[l];
        document.documentElement.lang = l;
        document.getElementById('t').textContent = t[0];
        document.getElementById('d').textContent = t[1];
        document.getElementById('b').textContent = t[2];
        window.addEventListener('online', function () { location.reload(); });
      })();
    </script>
  </body>
</html>
